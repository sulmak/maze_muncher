name: maze_muncher
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3   # SQLite on Windows/Linux/macOS
  flutter_local_notifications: ^18.0.1   # pinned to 18.x (the code uses its API)
  timezone: ^0.9.4
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0B1A"
    theme_color: "#0B0B1A"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
